name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q bot calendar services skills openclaw_modules
      - name: Run tests
        run: python -m pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check plugins/jina-tools/jina-core.js
          node --check plugins/jina-tools/index.js
          node --check plugins/agent-effectiveness/index.js
