# gbkz.uk → OpenClaw gateway (127.0.0.1:18789)
server {
    server_name gbkz.uk www.gbkz.uk;

    location / {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # WebSocket (WSS для iPhone)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gbkz.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gbkz.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.gbkz.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gbkz.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gbkz.uk www.gbkz.uk;
    return 404; # managed by Certbot




}