<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>R2D2 · мини-приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Phosphor Icons (система) + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <!-- Leaflet Map CSS & JS for Interactive Precipitation Radar -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ===== Токены (DESIGN_SPEC, из prototype-v18) ===== */
    :root {
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --surface-subtle: #F3F5F7;
      --border: #E6E9EE;
      --border-strong: #D9DEE6;
      --text: #121826;
      --text-muted: #4A5568;
      --icon: #737B86;
      --icon-active: #5964E8;
      --accent: #5964E8;
      --accent-soft: #EEF1FF;
      --radius-card: 20px;
      --radius-card-lg: 24px;
      --radius-icon: 999px;
      --shadow-soft: 0 8px 24px rgba(16, 24, 40, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171A;
        --surface: #1C1F24;
        --surface-subtle: #232730;
        --border: #2D3440;
        --border-strong: #3A4352;
        --text: #F3F5F7;
        --text-muted: #B9C2D0;
        --icon: #A0A8B5;
        --icon-active: #7C88FF;
        --accent: #7C88FF;
        --accent-soft: #2A3150;
        --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding-bottom: calc(86px + env(safe-area-inset-bottom));
    }
    .ph { color: var(--icon); }
    .ph-fill { color: var(--icon-active); }
    .leaflet-container { border-radius: 1rem; z-index: 10; }

    /* ===== Header Telegram shell ===== */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      height:58px;
      padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
      position:sticky; top:0; z-index:20;
      background: var(--bg);
    }
    .header .btn {
      width:36px; height:36px; border-radius:var(--radius-icon);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; cursor:pointer;
    }
    .header .btn .ph { font-size:20px; line-height:1; }
    .header .mid { text-align:center; flex:1; min-width:0; padding:0 8px; }
    .header .title { font-size:17px; font-weight:600; letter-spacing:-0.2px; line-height:1.2; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .header .subtitle { font-size:11px; color:var(--text-muted); font-weight:500; line-height:1.3; }

    /* ===== Summary strip ===== */
    .summary { display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; scrollbar-width:none; }
    .summary::-webkit-scrollbar { display:none; }
    .summary .pill {
      flex:0 0 auto; display:flex; align-items:center; gap:8px;
      height:46px; background: var(--surface); border:1px solid var(--border);
      border-radius:18px; padding:0 14px; color:var(--text); cursor:pointer;
    }
    .summary .pill .ic {
      width:28px; height:28px; border-radius:var(--radius-icon);
      background:var(--accent-soft); color:var(--accent);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .summary .pill .ic .ph { font-size:16px; line-height:1; }
    .summary .pill .txt { font-size:13px; font-weight:600; white-space:nowrap; }
    .summary .pill .chev { color:var(--text-muted); font-size:13px; margin-left:2px; }

    /* ===== WeatherCard (белый текст, тёмный градиент слева) ===== */
    .weather-card {
      --fc: #FFFFFF; --fc2: rgba(255,255,255,0.88); --div: rgba(255,255,255,0.25);
      margin: 0 16px 12px;
      min-height: 150px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background-size: cover;
      background-position: right center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFFFF;
    }
    .weather-card::before {
      content:""; position:absolute; inset:0;
      background: linear-gradient(90deg, rgba(8,12,26,0.78) 0%, rgba(8,12,26,0.48) 45%, rgba(8,12,26,0.18) 68%, rgba(8,12,26,0) 82%);
      pointer-events:none;
    }
    .weather-card__top { position:relative; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; padding:9px 16px 2px; }
    .weather-card__content { min-width:0; }
    .weather-card__city { font-size:14px; font-weight:800; color:var(--fc); text-shadow:0 1px 3px rgba(0,0,0,0.8), 0 0 12px rgba(0,0,0,0.35); }
    .weather-card__temp { font-size:44px; font-weight:800; letter-spacing:-2px; line-height:1; color:var(--fc); text-shadow:0 2px 6px rgba(0,0,0,0.85), 0 0 18px rgba(0,0,0,0.4); }
    .weather-card__temp sup { font-size:20px; font-weight:600; }
    .weather-card__desc { font-size:14px; font-weight:800; color:var(--fc); margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.35); }
    .weather-card__wind { font-size:12px; font-weight:700; color:var(--fc2); margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,0.8); }
    .weather-card__divider { height:1px; background:var(--div); margin:2px 16px 0; position:relative; z-index:1; }
    .weather-card__hourly { position:relative; z-index:1; display:flex; gap:8px; overflow-x:auto; padding:5px 0 8px 16px; scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; scroll-padding-inline:16px; }
    .h-item { text-align:center; scroll-snap-align:start; min-width:0; flex: 0 0 calc((100% - 40px) / 6); }
    .h-item:last-child { margin-right: 16px; }
    
    .weather-card__hourly::-webkit-scrollbar { display:none; }
    .h-item .h-time { font-size:12px; color:var(--fc); font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.35); }
    .h-item .h-ic { width:30px; height:30px; margin:2px auto; display:block; filter:drop-shadow(0 2px 5px rgba(0,0,0,0.9)) drop-shadow(0 0 4px rgba(255,255,255,0.55)) saturate(2.4) contrast(1.35) brightness(1.35); }
    .h-item .h-t { font-size:15px; font-weight:800; color:var(--fc); text-shadow:0 1px 3px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.35); }

    /* ===== Cards & rows (Apple Settings style) ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      margin: 0 16px 12px;
      overflow: hidden;
    }
    .row { display:flex; align-items:center; gap:12px; min-height:64px; padding:8px 14px; position:relative; cursor:pointer; }
    .row + .row::before { content:""; position:absolute; left:62px; right:0; top:0; height:0.5px; background:var(--border); }
    .row .ic {
      width:40px; height:40px; border-radius:var(--radius-icon);
      background:var(--surface-subtle); border:1px solid var(--border);
      color:var(--text);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .row .ic .ph { font-size:21px; line-height:1; }
    .row .ic.acc { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
    .row .ic.acc .ph { color:var(--accent); }
    .row .body { flex:1; min-width:0; }
    .row .title { font-size:15px; font-weight:700; color:var(--text); line-height:1.3; }
    .row .status { font-size:12px; color:var(--text-muted); font-weight:600; line-height:1.3; margin-top:1px; }
    .row .chev { color:var(--text-muted); font-weight:500; font-size:14px; margin-left:4px; flex-shrink:0; }

    /* ===== Tab bar ===== */
    .tabbar {
      position:fixed; left:0; right:0; bottom:0; z-index:100;
      display:flex; justify-content:space-around; align-items:center;
      height:74px; background:var(--surface);
      border-top:1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab { display:flex; flex-direction:column; align-items:center; gap:3px; min-width:56px; min-height:44px; justify-content:center; cursor:pointer; }
    .tab .ti { width:21px; height:21px; font-size:21px; line-height:1; color:var(--icon); display:flex; align-items:center; justify-content:center; }
    .tab .tl { font-size:10px; font-weight:500; color:var(--text-muted); }
    .tab.active .ti { color:var(--icon-active); }
    .tab.active .tl { color:var(--icon-active); }

    /* ===== Inline block inside card (раскрывающиеся секции) ===== */
    .block { padding: 14px 16px 16px; border-top: 0.5px solid var(--border); }
    .block .b-title { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; }



    /* ===== Единая типографика (гиперпедант: одна шкала по всему приложению) ===== */
    .text-\[10px\] { font-size: 11px !important; line-height: 1.35 !important; }
    .text-\[11px\] { font-size: 11px !important; line-height: 1.35 !important; }
    .text-xs { font-size: 12px !important; line-height: 1.4 !important; }
    .text-sm { font-size: 14px !important; line-height: 1.4 !important; }
    .text-base { font-size: 15px !important; line-height: 1.4 !important; }
    .text-lg { font-size: 17px !important; line-height: 1.35 !important; }
    .text-xl { font-size: 20px !important; line-height: 1.3 !important; }
    .font-medium { font-weight: 500 !important; }
    .font-semibold { font-weight: 600 !important; }
    .font-bold { font-weight: 700 !important; }
    .font-black { font-weight: 800 !important; }
    .font-mono { font-family: inherit !important; font-variant-numeric: tabular-nums !important; }

    /* ===== Token overrides: под-экраны (архив/источники/дайджест/викторины/переводчик/админ) ===== */
    .bg-slate-50 { background: var(--surface-subtle) !important; }
    .bg-slate-100 { background: var(--surface-subtle) !important; }
    .bg-slate-200 { background: var(--border) !important; }
    .bg-blue-50 { background: var(--accent-soft) !important; }
    .bg-blue-600 { background: var(--accent) !important; }
    .bg-emerald-50 { background: rgba(16,185,129,0.1) !important; }
    .bg-emerald-600 { background: #10B981 !important; }
    .bg-red-50 { background: rgba(239,68,68,0.1) !important; }
    .bg-amber-50 { background: rgba(245,158,11,0.12) !important; }
    .bg-violet-50 { background: rgba(139,92,246,0.12) !important; }
    .bg-white { background: var(--surface) !important; }
    .border-slate-200 { border-color: var(--border) !important; }
    .border-blue-200 { border-color: var(--accent-soft) !important; }
    .border-blue-600 { border-color: var(--accent) !important; }
    .border-red-200 { border-color: rgba(239,68,68,0.25) !important; }
    .border-emerald-200 { border-color: rgba(16,185,129,0.3) !important; }
    .border-amber-200 { border-color: rgba(245,158,11,0.3) !important; }
    .border-violet-200 { border-color: rgba(139,92,246,0.3) !important; }
    .border-slate-300 { border-color: var(--border-strong) !important; }
    .text-slate-400 { color: var(--text-muted) !important; }
    .text-slate-500 { color: var(--text-muted) !important; }
    .text-slate-600 { color: var(--text) !important; }
    .text-slate-700 { color: var(--text) !important; }
    .text-slate-800 { color: var(--text) !important; }
    .text-slate-900 { color: var(--text) !important; }
    .text-blue-600 { color: var(--accent) !important; }
    .text-blue-700 { color: var(--accent) !important; }
    .text-emerald-600 { color: #10B981 !important; }
    .text-emerald-700 { color: #059669 !important; }
    .text-emerald-800 { color: #047857 !important; }
    .text-red-500 { color: #EF4444 !important; }
    .text-amber-700 { color: #D97706 !important; }
    .text-violet-700 { color: #8B5CF6 !important; }
    .shadow-sm { box-shadow: var(--shadow-soft) !important; }
    .shadow-md { box-shadow: 0 8px 20px rgba(89,100,232,0.3) !important; }

    .toast {
      position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
      background:rgba(18,24,38,0.92); color:#fff; font-size:13px; font-weight:500;
      padding:10px 16px; border-radius:12px; opacity:0; pointer-events:none;
      transition:opacity .25s, transform .25s; z-index:300; white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>

<body class="min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [view, setView] = useState('main'); // 'main' | 'archive' | 'sources' | 'digest' | 'admin'

      // ================= 0. АВТОРИЗАЦИЯ (Telegram WebApp initData + FaceID) =================
      const [auth, setAuth] = useState({ state: 'loading', user: null }); // loading | login | ok
      const [authError, setAuthError] = useState('');
      const [bioStatus, setBioStatus] = useState(''); // диагностика FaceID: что происходит

      // обёртка fetch: добавляет Authorization: Bearer <token>
      const apiFetch = (url, opts = {}) => {
        const token = sessionStorage.getItem('hub_token');
        const headers = { ...(opts.headers || {}) };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { ...opts, headers });
      };

      // при старте: проверить токен + заранее инициализировать биометрию
      useEffect(() => {
        const token = sessionStorage.getItem('hub_token');
        if (!token) { setAuth({ state: 'login', user: null }); } else {
          apiFetch('/miniapp/api/auth/me')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => setAuth({ state: 'ok', user: d.user }))
            .catch(() => { sessionStorage.removeItem('hub_token'); setAuth({ state: 'login', user: null }); });
        }
        // заранее инициализируем BiometricManager, чтобы к моменту клика он был готов
        const tg = window.Telegram?.WebApp;
        const bm = tg?.BiometricManager;
        if (tg && !tg.initData) setBioStatus('⚠ нет initData (открыто не из Telegram?)');
        if (bm && !bm.isInited) {
          setBioStatus('⏳ инициализация биометрии…');
          bm.init(() => {
            setBioStatus(bm.isBiometricAvailable
              ? `✅ биометрия доступна (тип: ${bm.biometricType || '?'}${bm.isAccessGranted ? ', доступ ✓' : ', доступ не выдан'})`
              : '❌ биометрия НЕдоступна на этом устройстве');
          });
        } else if (bm) {
          setBioStatus(bm.isBiometricAvailable
            ? `✅ биометрия доступна (тип: ${bm.biometricType || '?'}${bm.isAccessGranted ? ', доступ ✓' : ', доступ не выдан'})`
            : '❌ биометрия НЕдоступна на этом устройстве');
        } else {
          setBioStatus('— BiometricManager не найден (старый клиент?)');
        }
      }, []);

      const doLogin = () => {
        setAuthError('');
        const tg = window.Telegram?.WebApp;
        const bm = tg?.BiometricManager;
        const attempt = () => {
          const initData = tg?.initData || '';
          fetch('/miniapp/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData }),
          })
            .then(r => r.json())
            .then(d => {
              if (d.token) {
                sessionStorage.setItem('hub_token', d.token);
                setAuth({ state: 'ok', user: d.user });
              } else {
                setAuthError(d.error || 'Ошибка входа');
              }
            })
            .catch(() => setAuthError('Сервер недоступен'));
        };
        const authFace = () => {
          // на десктопе (Telegram Desktop/Mac) биометрия часто недоступна —
          // не идём в requestAccess, сразу вход по подписи Telegram
          if (!bm.isBiometricAvailable) {
            setBioStatus('— биометрия недоступна на этом устройстве, вход по подписи Telegram');
            attempt();
            return;
          }
          setBioStatus('🔄 запрашиваем FaceID…');
          const faceDone = (label) => {
            // Флаг isAuthenticated на iOS обновляется асинхронно/глючит —
            // проверяем с задержкой, но НЕ блокируем вход: initData уже
            // проверен сервером криптографически, FaceID — UX-подтверждение.
            setTimeout(() => {
              setBioStatus(bm.isAuthenticated
                ? '✅ FaceID подтверждён'
                : label + ' (флаг клиента не обновился, вход по подписи Telegram)');
              attempt();
            }, 200);
          };
          try {
            // новые версии API: requestAccess({reason}, cb)
            bm.requestAccess({ reason: 'Вход в Personal Hub' }, () => {
              setBioStatus(bm.isAccessGranted ? '✅ доступ к биометрии выдан, сканируем…' : '⚠ доступ к биометрии не выдан — вход без FaceID');
              if (bm.isAccessGranted) {
                bm.authenticate({ reason: 'Вход в Personal Hub' }, () => {
                  faceDone('✅ FaceID: лицо принято');
                });
              } else {
                attempt();
              }
            });
          } catch (e) {
            // старые версии API: requestAccess(cb), authenticate(cb)
            setBioStatus('⚠ старый API биометрии');
            bm.requestAccess(() => {
              if (bm.isAccessGranted) {
                bm.authenticate('Вход в Personal Hub', () => {
                  faceDone('✅ FaceID: лицо принято');
                });
              } else attempt();
            });
          }
        };
        // сначала FaceID (если доступен), затем initData
        if (bm) {
          if (bm.isInited) {
            authFace();
          } else {
            setBioStatus('⏳ инициализация биометрии…');
            // на десктопе init может не вызвать колбэк — страховка: таймаут
            let done = false;
            const fallback = () => {
              if (done) return;
              done = true;
              setBioStatus('— биометрия не ответила, вход по подписи Telegram');
              attempt();
            };
            setTimeout(fallback, 2500);
            try {
              bm.init(() => {
                if (done) return;
                done = true;
                authFace();
              });
            } catch (e) {
              fallback();
            }
          }
        } else {
          setBioStatus('— биометрия недоступна, вход по подписи Telegram');
          attempt();
        }
        haptic && haptic('medium');
      };

      const doLogout = () => {
        const token = sessionStorage.getItem('hub_token');
        if (token) apiFetch('/miniapp/api/auth/logout', { method: 'POST' }).catch(() => {});
        sessionStorage.removeItem('hub_token');
        setAuth({ state: 'login', user: null });
      };

      // ================= ПАРОЛЬ (для входа на десктопе/браузере) =================
      const [passState, setPassState] = useState({ showSet: false, showLogin: false, newPass: '', login: '', pwd: '', setPwd: '', msg: '' });
      const setMyPassword = () => {
        const p = passState.newPass;
        if (p.length < 4) { setPassState(s => ({ ...s, msg: 'Пароль слишком короткий (мин. 4)' })); return; }
        apiFetch('/miniapp/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ setPassword: true, password: p }),
        })
          .then(r => r.json())
          .then(d => {
            setPassState(s => ({ ...s, msg: d.ok ? '✅ Пароль сохранён' : (d.error || 'Ошибка'), newPass: d.ok ? '' : s.newPass }));
          })
          .catch(() => setPassState(s => ({ ...s, msg: 'Сервер недоступен' })));
        haptic('light');
      };
      // установка пароля прямо с экрана входа (по initData, работает и на Mac в Telegram)
      const setPasswordOnLogin = () => {
        const p = passState.setPwd;
        if (p.length < 4) { setPassState(s => ({ ...s, msg: 'Пароль слишком короткий (мин. 4)' })); return; }
        setPassState(s => ({ ...s, msg: '' }));
        fetch('/miniapp/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ setPassword: true, password: p, initData: window.Telegram?.WebApp?.initData || '' }),
        })
          .then(r => r.json())
          .then(d => {
            setPassState(s => ({ ...s, msg: d.ok ? '✅ Пароль сохранён! Теперь войдите по нему' : (d.error || 'Ошибка'), setPwd: d.ok ? '' : s.setPwd }));

          .catch(() => setPassState(s => ({ ...s, msg: 'Сервер недоступен' })));

      };
      const doLoginPassword = () => {
        const { login, pwd } = passState;
        if (!login || !pwd) { setPassState(s => ({ ...s, msg: 'Введите логин и пароль' })); return; }

          .then(d => {
            if (d.token) {
              sessionStorage.setItem('hub_token', d.token);
              setAuth({ state: 'ok', user: d.user });

          .catch(() => setPassState(s => ({ ...s, msg: 'Сервер недоступен' })));
        haptic('medium');
      };

      // ================= 1. ПОГОДА =================
      const [weather, setWeather] = useState({ temp: 24, condition: 'Ясно, без осадков', wind: '2.8 м/с', city: 'Москва', icon: 'clear-day' });
      const [om, setOm] = useState(null); // Open-Meteo: текущие + почасовой прогноз (Москва)

        fetch('https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&hourly=temperature_2m,rain,snowfall,wind_speed_10m,weathercode&current=temperature_2m,rain,snowfall,wind_speed_10m,weathercode&timezone=Europe%2FMoscow&forecast_days=2')

      // ================= 2. ЗАДАЧИ & АРХИВ =================

            { id: 1, text: 'Согласовать спецификацию с юристами', done: false, createdAt: '10:15' },
            { id: 2, text: 'Проверить выгрузку реестра оплат', done: true, createdAt: 'Вчера, 18:30' }
          ];

          return [];

      const [taskInput, setTaskInput] = useState('');

      useEffect(() => {
        localStorage.setItem('hub_tasks_v2', JSON.stringify(tasks));
      }, [tasks]);

      const handleAddTask = (textOverride) => {
        const text = (textOverride || taskInput).trim();
        if (!text) return;
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        const newTask = {
          id: Date.now(),
          text: text,
          done: false,
          createdAt: `${dateStr}, ${timeStr}`
        };
        setTasks(prev => [newTask, ...prev]);
        setTaskInput('');
        haptic('medium');
      };

      // Голосовой ввод задачи (Web Speech API, где поддерживается)
      const [voiceError, setVoiceError] = useState('');
      const startVoiceInput = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          setVoiceError('Голосовой ввод не поддерживается в этом браузере');
          setTimeout(() => setVoiceError(''), 3000);
          return;
        }
        setVoiceError('');
        const rec = new SR();
        rec.lang = 'ru-RU';
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        rec.onresult = (e) => {
          const text = e.results[0][0].transcript;
          // сначала — в поле ввода, пользователь сам жмёт «+» для добавления
          setTaskInput(text);
        };
        rec.onerror = () => {
          setVoiceError('Не удалось распознать речь, попробуйте ещё раз');
          setTimeout(() => setVoiceError(''), 3000);
        };
        rec.start();
        haptic('medium');
      };

        setTasks(prev => prev.map(t => {

          return t;
        }));
      };

      const deleteTask = (id) => {
        haptic('light');
        setTasks(prev => prev.filter(t => t.id !== id));
      };

              45: ['Туман', 'fog'], 48: ['Изморозь', 'fog'], 51: ['Морось', 'drizzle'], 53: ['Морось', 'drizzle'], 55: ['Морось', 'drizzle'],
              61: ['Небольшой дождь', 'rain'], 63: ['Дождь', 'rain'], 65: ['Сильный дождь', 'rain'],
              71: ['Небольшой снег', 'snow'], 73: ['Снег', 'snow'], 75: ['Сильный снег', 'snow'],
              80: ['Ливень', 'rain'], 81: ['Ливень', 'rain'], 82: ['Сильный ливень', 'thunderstorms'],
              95: ['Гроза', 'thunderstorms'], 96: ['Гроза с градом', 'thunderstorms'], 99: ['Гроза с градом', 'thunderstorms']
            };
            const c = codes[cw.weathercode];

      const [quiz, setQuiz] = useState(null);

      const [activityError, setActivityError] = useState('');

      const loadQuiz = () => {
        setQuizLoading(true); setQuizError(''); setShowAnswer(false);
        apiFetch('/miniapp/api/quiz?count=1')

      const loadActivity = () => {
        setActivityLoading(true); setActivityError('');

          .then(r => r.json())

            else setActivityError(d.error || 'Не удалось получить идею');

      useEffect(() => {

      // ================= 7. ПЕРЕВОДЧИК (MyMemory через /api/translate) =================
      const [trText, setTrText] = useState('');

      const [trResult, setTrResult] = useState('');

      const [trError, setTrError] = useState('');
      const [trCopied, setTrCopied] = useState(false);

      const [dictDst, setDictDst] = useState('');

        { id: 'en|ru', label: '🇬🇧 Английский → 🇷🇺 Русский' },
        { id: 'ru|en', label: '🇷🇺 Русский → 🇬🇧 Английский' },
        { id: 'es|ru', label: '🇪🇸 Испанский → 🇷🇺 Русский' },

      }, []);

        setDict(d);
        try { localStorage.setItem('hub_dict', JSON.stringify(d)); } catch (_) {}
      };
      const addDict = (src, dst) => {
        if (!src.trim()) return;
        saveDict([{ id: Date.now(), src: src.trim(), dst: (dst || '').trim() }, ...dict]);
      };
      const removeDict = (id) => saveDict(dict.filter(x => x.id !== id));

      const doTranslate = () => {
        if (!trText.trim()) { setTrError('Введи текст для перевода'); return; }
        setTrLoading(true); setTrError(''); setTrResult('');
        const [from, to] = trPair.split('|');
        apiFetch('/miniapp/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: trText, from, to }),
        })
          .then(r => r.json())
          .then(d => {
            if (d.ok) setTrResult(d.text || '');
            else setTrError(d.error || 'Ошибка перевода');
          })
          .catch(() => setTrError('Сервер недоступен'))
          .finally(() => setTrLoading(false));
      };

      const priceLabel = (p) => {
        if (p === undefined || p === null) return '';
        if (p === 0) return 'Бесплатно';
        if (p < 0.3) return 'Дёшево';
        if (p < 0.7) return 'Средне';
        return 'Дорого';
      };
      const accessLabel = (a) => {
        if (a === undefined || a === null) return '';
        if (a < 0.3) return 'Легко организовать';
        if (a < 0.7) return 'Средняя сложность';
        return 'Сложно организовать';
      };

      return (
        <div className="max-w-xl mx-auto font-sans pb-4">

          {/* ================= 0. ЭКРАН ВХОДА ================= */}
          {auth.state === 'loading' && (
            <div className="flex flex-col items-center justify-center py-32 space-y-3">
              <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
              <div className="text-xs font-bold text-slate-500">Проверяем авторизацию…</div>
            </div>

          {auth.state === 'login' && (
            <div className="flex flex-col items-center justify-center min-h-[80vh] px-6 text-center">
              <div className="card p-8 w-full max-w-xs space-y-4">

                </div>
                <div>
                  <div className="text-xl font-bold" style={{color:'var(--text)'}}>R2D2</div>
                  <div className="text-[11px] font-medium" style={{color:'var(--text-muted)'}}>мини-приложение</div>

                      'snow': n ? 'snow-night' : 'snow-background',
                      'sleet': n ? 'snow-night' : 'sleet-background',
                      'wind': n ? 'cloudy-night' : 'wind-background',
                      'clear-night': 'clear-night',

                    return om.hourly.time.slice(startIdx, startIdx + 10).map((t, i) => {
                      const j = startIdx + i;
                      const r = om.hourly.rain?.[j] || 0;
                      const s = om.hourly.snowfall?.[j] || 0;
                      const wc = om.hourly.weathercode?.[j] ?? 0;
                      const total = r + s;
                      let icon;
                      if (total > 0) {
                        icon = total < 0.3 ? 'drizzle' : total < 3 ? 'rain' : 'thunderstorms';

                        icon = wc === 0 ? 'clear-day' : wc <= 2 ? 'partly-cloudy-day' : wc >= 95 ? 'thunderstorms' : wc >= 80 ? 'rain' : wc >= 71 ? 'snow' : wc >= 61 ? 'rain' : wc >= 51 ? 'drizzle' : wc >= 45 ? 'fog' : 'cloudy';

                      </select>
                      <i className="ph ph-arrow-right shrink-0" style={{ color: 'var(--text-muted)', fontSize: '16px' }}></i>
                      <select value={toCurr} onChange={(e) => setToCurr(e.target.value)}
                        className="shrink-0 rounded-xl px-2 py-2.5 text-xs font-bold outline-none border"
                        style={{ background: 'var(--surface-subtle)', borderColor: 'var(--border)', color: 'var(--text)' }}>
                        {['RUB', 'USD', 'EUR', 'CNY', 'JPY', 'GBP'].map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div className="flex items-center justify-between rounded-xl px-3.5 py-3" style={{ background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.25)' }}>
                      <span className="text-[10px] font-bold uppercase tracking-wide" style={{ color: 'var(--text-muted)' }}>Результат</span>
                      <span className="text-base font-black" style={{ color: '#059669', fontVariantNumeric: 'tabular-nums', lineHeight: 1.2 }}>{convertValue()} {toCurr}</span>
                    </div>
                  </div>
                )}
              </div>

              <div className="space-y-3.5">
                {digestLoading && (
                  <div className="text-center py-8 text-xs text-slate-400">Собираем дайджест…</div>
                )}
                {digestError && !digestLoading && (
                  <div className="text-center py-6 text-xs text-red-500">{digestError}</div>
                )}
                {!digestLoading && !digestError && digestData && (
                  <>
                    {digestData.blocks && digestData.blocks.length > 0 ? digestData.blocks.map((block, bi) => (
                      <div key={bi} className="card p-4 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="px-2 py-0.5 rounded-lg bg-blue-50 text-blue-700 text-[10px] font-bold border border-blue-200">
                            {block.title}
                          </span>
                          <span className="text-[10px] font-semibold text-slate-400">{block.posts.length} постов</span>
                        </div>
                        {block.summary && (
                          <div className="text-sm font-semibold text-slate-800 leading-snug whitespace-pre-wrap">
                            {block.summary}
                          </div>
                        )}
                        <div className="space-y-2">
                          {block.posts.map((p, pi) => (
                            <div key={pi} className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                              • {p}
                            </div>
                          ))}
                        </div>
                      </div>
                    )) : (
                      <div className="text-center py-8 text-xs text-slate-400">За выбранный период свежих постов нет.</div>
                    )}
                    {digestData.curs && (
                      <div className="card p-4 text-center">
                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">Курс (ЦБ)</div>
                        <div className="text-xs font-black text-slate-700">{digestData.curs}</div>
                        <div className="text-[10px] text-slate-400 mt-1">⭐ Всего постов: {digestData.total}</div>
                      </div>
                    )}
                  </>
                )}
              </div>
              <button
                onClick={() => { haptic('light'); loadDigest(); }}
                className="w-full py-3 bg-slate-900 active:scale-98 text-white rounded-2xl font-bold text-xs transition"
              >
                Обновить дайджест
              </button>
            </div>
          )}

          {/* ================= 5. ЭКРАН: ВИКТОРИНЫ & ИДЕИ ================= */}
          {auth.state === 'ok' && view === 'fun' && (
            <div className="space-y-4 pb-24 animate-fade-in">

              {/* Header экрана (стиль прототипа) */}
              <div className="header">
                <div className="btn" onClick={() => { haptic(); setView('main'); }}>
                  <i className="ph ph-arrow-left"></i>
                </div>
                <div className="mid">
                  <div className="title">Викторины & Идеи</div>
                  <div className="subtitle">Вопросы и занятия</div>
                </div>
                <div className="btn" onClick={() => { haptic('light'); loadQuiz(); }}>
                  <i className="ph ph-shuffle"></i>
                </div>
              </div>

              {/* Викторина */}
              <div className="card">
                <div className="row">
                  <div className="ic acc"><i className="ph ph-brain"></i></div>
                  <div className="body">
                    <div className="title">Вопрос для викторины</div>
                    <div className="status">Open Trivia DB</div>
                  </div>
                  <button
                    onClick={() => { haptic('light'); loadQuiz(); }}
                    disabled={quizLoading}
                    className="px-3 py-1.5 rounded-xl font-bold text-xs transition active:scale-95 disabled:opacity-50 text-white"
                    style={{ background: 'var(--accent)' }}
                  >
                    {quizLoading ? '…' : 'Новый'}
                  </button>
                </div>
                <div className="block space-y-3">
                  {quizError && <div className="text-xs font-bold px-3 py-2 rounded-xl" style={{ color: '#EF4444', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)' }}>{quizError}</div>}
                  {quizLoading && !quiz && (
                    <div className="text-center py-6 text-xs" style={{ color: 'var(--text-muted)' }}>Загружаем вопрос…</div>
                  )}
                  {quiz && !quizLoading && (
                    <div className="space-y-3">
                      {quiz.category && (
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span className="px-2 py-0.5 rounded-lg text-[11px] font-bold" style={{ color: 'var(--accent)', background: 'var(--accent-soft)' }}>
                            {quiz.category.title || 'Без категории'}
                          </span>
                          {quiz.value && (
                            <span className="px-2 py-0.5 rounded-lg text-[11px] font-bold" style={{ color: '#D97706', background: 'rgba(245,158,11,0.12)' }}>
                              ${quiz.value}
                            </span>
                          )}
                        </div>
                      )}
                      <div className="text-sm font-bold leading-snug" style={{ color: 'var(--text)' }}>
                        {quiz.question || '(вопрос не найден)'}
                      </div>
                      {!showAnswer ? (
                        <button
                          onClick={() => { haptic('medium'); setShowAnswer(true); }}
                          className="w-full py-3 rounded-2xl font-bold text-xs transition active:scale-95 text-white"
                          style={{ background: 'var(--text)' }}
                        >
                          Показать ответ
                        </button>
                      ) : (
                        <div className="p-3.5 rounded-2xl" style={{ background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.25)' }}>
                          <div className="text-[11px] font-bold uppercase tracking-wide mb-0.5" style={{ color: '#10B981' }}>Ответ</div>
                          <div className="text-sm font-bold" style={{ color: 'var(--text)' }}>{quiz.answer || '—'}</div>
                        </div>
                      )}
                      {quiz.airdate && (
                        <div className="text-[11px]" style={{ color: 'var(--text-muted)' }}>Эфир: {new Date(quiz.airdate).toLocaleDateString('ru-RU')}</div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* Чем заняться */}
              <div className="card">
                <div className="row">
                  <div className="ic"><i className="ph ph-lightbulb"></i></div>
                  <div className="body">
                    <div className="title">Чем заняться</div>
                    <div className="status">BoredAPI</div>
                  </div>
                  <button
                    onClick={() => { haptic('light'); loadActivity(); }}
                    disabled={activityLoading}
                    className="px-3 py-1.5 rounded-xl font-bold text-xs transition active:scale-95 disabled:opacity-50 text-white"
                    style={{ background: 'var(--text)' }}
                  >
                    {activityLoading ? '…' : 'Идея'}
                  </button>
                </div>
                <div className="block space-y-3">
                  {activityError && <div className="text-xs font-bold px-3 py-2 rounded-xl" style={{ color: '#EF4444', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)' }}>{activityError}</div>}
                  {activityLoading && !activity && (
                    <div className="text-center py-6 text-xs" style={{ color: 'var(--text-muted)' }}>Подбираем занятие…</div>
                  )}
                  {activity && !activityLoading && (
                    <div className="space-y-3">
                      <div className="text-sm font-bold leading-snug" style={{ color: 'var(--text)' }}>
                        {activity.activity}
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        <span className="px-2 py-0.5 rounded-lg text-[11px] font-bold capitalize" style={{ color: '#8B5CF6', background: 'rgba(139,92,246,0.12)' }}>
                          {activity.type || 'разное'}
                        </span>
                        {activity.participants && (
                          <span className="px-2 py-0.5 rounded-lg text-[11px] font-bold" style={{ color: 'var(--text-muted)', background: 'var(--surface-subtle)' }}>
                            {activity.participants} {activity.participants === 1 ? 'участник' : activity.participants < 5 ? 'участника' : 'участников'}
                          </span>
                        )}
                        {priceLabel(activity.price) && (
                          <span className="px-2 py-0.5 rounded-lg text-[11px] font-bold" style={{ color: '#059669', background: 'rgba(16,185,129,0.1)' }}>
                            {priceLabel(activity.price)}
                          </span>
                        )}
                        {accessLabel(activity.accessibility) && (
                          <span className="px-2 py-0.5 rounded-lg text-[11px] font-bold" style={{ color: '#D97706', background: 'rgba(245,158,11,0.12)' }}>
                            {accessLabel(activity.accessibility)}
                          </span>
                        )}
                      </div>
                      {activity.link && (
                        <a
                          href={activity.link}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="block text-center text-xs font-bold underline underline-offset-2"
                          style={{ color: 'var(--accent)' }}
                        >
                          Подробнее →
                        </a>
                      )}
                    </div>
                  )}
                </div>
              </div>

              <div className="text-center text-[11px]" style={{ color: 'var(--text-muted)' }}>
                Данные: Open Trivia DB · BoredAPI
              </div>
            </div>
          )}

          {/* ================= 8. ПЕРЕВОДЧИК & СЛОВАРЬ ================= */}
          {auth.state === 'ok' && view === 'translate' && (
            <div className="space-y-4 pb-24 animate-fade-in">

              {/* Header экрана (стиль прототипа) */}
              <div className="header">
                <div className="btn" onClick={() => { haptic(); setView('main'); }}>
                  <i className="ph ph-arrow-left"></i>
                </div>
                <div className="mid">
                  <div className="title">Переводчик</div>
                  <div className="subtitle">Английский ↔ русский · испанский ↔ русский</div>
                </div>
                <div className="btn" onClick={() => { haptic(); setTrText(''); setTrResult(''); setTrError(''); }}>
                  <i className="ph ph-trash"></i>
                </div>
              </div>

              {/* Выбор пары языков — segmented control */}
              <div className="card p-1.5 flex gap-1">
                {PAIRS.map(p => (
                  <button
                    key={p.id}
                    onClick={() => { haptic('light'); setTrPair(p.id); setTrResult(''); }}
                    className={`flex-1 py-2.5 rounded-xl font-bold text-[11px] transition active:scale-95 ${trPair === p.id ? 'text-white' : ''}`}
                    style={trPair === p.id ? { background: 'var(--accent)', color: '#fff' } : { color: 'var(--text-muted)', background: 'transparent' }}
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              {/* Ввод текста */}
              <div className="card p-4 space-y-3">
                <textarea
                  value={trText}
                  onChange={e => setTrText(e.target.value)}
                  placeholder="Вставь текст для перевода…"
                  rows="4"
                  className="w-full rounded-2xl p-3 text-sm resize-none outline-none border"
                  style={{ background: 'var(--surface-subtle)', borderColor: 'var(--border)', color: 'var(--text)' }}
                />
                <div className="flex gap-2">
                  <button
                    onClick={() => { haptic('medium'); doTranslate(); }}
                    disabled={trLoading || !trText.trim()}
                    className="flex-1 py-3 rounded-2xl font-bold text-sm transition active:scale-95 disabled:opacity-40"
                    style={{ background: 'var(--accent)', color: '#fff' }}
                  >
                    {trLoading ? '…' : 'Перевести'}
                  </button>
                  <button
                    onClick={() => { haptic(); setTrText(''); setTrResult(''); setTrError(''); }}
                    className="px-4 py-3 rounded-2xl font-bold text-sm transition active:scale-95"
                    style={{ background: 'var(--surface-subtle)', color: 'var(--text-muted)', border: '1px solid var(--border)' }}
                  >
                    <i className="ph ph-x"></i>
                  </button>
                </div>
                {trError && <div className="text-xs font-bold px-3 py-2 rounded-xl" style={{ color: '#EF4444', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)' }}>{trError}</div>}
                {trResult && (
                  <div className="rounded-2xl p-3.5 space-y-2" style={{ background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.25)' }}>
                    <div className="text-sm whitespace-pre-wrap break-words" style={{ color: 'var(--text)' }}>{trResult}</div>
                    <div className="flex items-center gap-3 pt-1">
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(trResult);
                          haptic('notification');
                          setTrCopied && setTrCopied(true);
                          setTimeout(() => setTrCopied && setTrCopied(false), 2000);
                        }}
                        className="text-[11px] font-bold underline underline-offset-2"
                        style={{ color: '#10B981' }}
                      >
                        {trCopied ? 'Скопировано ✓' : 'Копировать'}
                      </button>
                      <button
                        onClick={() => { haptic('medium'); addDict(trText, trResult); }}
                        className="flex-1 py-2 rounded-xl font-bold text-xs transition active:scale-95 text-white"
                        style={{ background: '#10B981' }}
                      >
                        В словарь
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Словарь */}
              <div className="card p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase tracking-wide" style={{ color: 'var(--text-muted)' }}>Словарь ({dict.length})</span>
                  <span className="text-[10px]" style={{ color: 'var(--text-muted)' }}>хранится на устройстве</span>
                </div>

                {/* Быстрое добавление: фраза + перевод */}
                <div className="space-y-2">
                  <input
                    value={dictSrc}
                    onChange={e => setDictSrc(e.target.value)}
                    placeholder="Фраза (англ/исп)…"
                    className="w-full rounded-xl px-3 py-2.5 text-sm outline-none border"
                    style={{ background: 'var(--surface-subtle)', borderColor: 'var(--border)', color: 'var(--text)' }}
                  />
                  <input
                    value={dictDst}
                    onChange={e => setDictDst(e.target.value)}
                    placeholder="Перевод на русский…"
                    className="w-full rounded-xl px-3 py-2.5 text-sm outline-none border"
                    style={{ background: 'var(--surface-subtle)', borderColor: 'var(--border)', color: 'var(--text)' }}
                  />
                  <button
                    onClick={() => { haptic('medium'); addDict(dictSrc, dictDst); setDictSrc(''); setDictDst(''); }}
                    disabled={!dictSrc.trim()}
                    className="w-full py-2.5 rounded-xl font-bold text-xs transition active:scale-95 text-white disabled:opacity-40"
                    style={{ background: 'var(--text)' }}
                  >
                    Добавить в словарь
                  </button>
                </div>

                {/* Список */}
                {dict.length === 0 ? (
                  <div className="text-xs rounded-xl px-3 py-4 text-center" style={{ color: 'var(--text-muted)', background: 'var(--surface-subtle)' }}>
                    Словарь пуст. Добавь фразу с переводом или сохрани перевод кнопкой «В словарь».
                  </div>
                ) : (
                  <div className="space-y-2 max-h-72 overflow-y-auto">
                    {dict.map(x => (
                      <div key={x.id} className="rounded-xl px-3 py-2.5 space-y-0.5" style={{ background: 'var(--surface-subtle)', border: '1px solid var(--border)' }}>
                        <div className="flex items-start justify-between gap-2">
                          <div className="text-sm font-bold break-words" style={{ color: 'var(--text)' }}>{x.src}</div>
                          <button
                            onClick={() => { haptic('light'); removeDict(x.id); }}
                            className="text-sm shrink-0"
                            style={{ color: 'var(--text-muted)' }}
                          >
                            <i className="ph ph-x"></i>
                          </button>
                        </div>
                        {x.dst && <div className="text-xs break-words" style={{ color: 'var(--text-muted)' }}>🇷🇺 {x.dst}</div>}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="text-center text-[10px]" style={{ color: 'var(--text-muted)' }}>
                Перевод: MyMemory API · лимит ~50K символов/день
              </div>
            </div>
          )}

        </div>
      );
    }

    function AdminPanel({ auth, apiFetch, haptic, onBack }) {
      const [users, setUsers] = useState([]);
      const [audit, setAudit] = useState([]);
      const [err, setErr] = useState('');
      const [busy, setBusy] = useState(false);

      const load = () => {
        Promise.all([
          apiFetch('/miniapp/api/admin/users').then(r => r.json()),
          apiFetch('/miniapp/api/admin/audit').then(r => r.json()),
        ]).then(([u, a]) => {
          if (u.ok) setUsers(u.users || []);
          if (a.ok) setAudit(a.audit || []);
        }).catch(() => setErr('Не удалось загрузить админ-данные'));
      };

      useEffect(() => { load(); }, []);

      const updateUser = (tgId, patch) => {
        setBusy(true); setErr('');
        apiFetch('/miniapp/api/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: tgId, ...patch }),
        })
          .then(r => r.json())
          .then(d => { if (d.ok) setUsers(d.users); else setErr(d.error || 'Ошибка'); })
          .catch(() => setErr('Сервер недоступен'))
          .finally(() => setBusy(false));
      };

      const deleteUser = (tgId) => {
        if (!confirm('Удалить пользователя?')) return;
        setBusy(true); setErr('');
        apiFetch('/miniapp/api/admin/users?telegram_id=' + tgId, { method: 'DELETE' })
          .then(r => r.json())
          .then(d => { if (d.ok) setUsers(d.users); else setErr(d.error || 'Ошибка'); })
          .catch(() => setErr('Сервер недоступен'))
          .finally(() => setBusy(false));
      };

      return (
        <div className="space-y-4 animate-fade-in pb-24">
          <div className="flex items-center justify-between">
            <button
              onClick={() => { haptic(); onBack(); }}
              className="px-3.5 py-2 bg-slate-100 border border-slate-200 text-slate-700 font-bold rounded-xl text-xs transition active:scale-95"
            >
              ← Назад
            </button>
            <span className="text-xs font-black text-purple-600 bg-purple-50 px-2.5 py-1 rounded-lg border border-purple-200">Админ-панель</span>
            <button onClick={() => { haptic('light'); load(); }} className="text-xs font-bold text-slate-500 px-2 py-1">🔄</button>
          </div>

          {err && <div className="text-xs font-bold text-red-500 bg-red-50 border border-red-200 rounded-xl px-3 py-2">{err}</div>}

          {/* Пользователи */}
          <div className="card p-4 space-y-2">
            <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1">Пользователи</div>
            {users.map(u => (
              <div key={u.telegram_id} className="flex items-center justify-between gap-2 p-2.5 bg-slate-50 rounded-xl border border-slate-200">
                <div className="min-w-0">
                  <div className="text-xs font-bold text-slate-800 truncate">
                    {u.first_name || u.username || ('id ' + u.telegram_id)}
                    {u.telegram_id === auth.user.telegram_id && <span className="text-blue-500"> (вы)</span>}
                  </div>
                  <div className="text-[10px] text-slate-400 truncate">@{u.username || '—'} · tg:{u.telegram_id}</div>
                </div>
                <div className="flex items-center gap-1.5 shrink-0">
                  <select
                    value={u.role}
                    disabled={u.telegram_id === auth.user.telegram_id || busy}
                    onChange={e => updateUser(u.telegram_id, { role: e.target.value })}
                    className="text-[10px] font-bold bg-white border border-slate-200 rounded-lg px-1.5 py-1"
                  >
                    <option value="user">user</option>
                    <option value="admin">admin</option>
                  </select>
                  <button
                    onClick={() => updateUser(u.telegram_id, { allowed: u.allowed ? false : true })}
                    disabled={u.telegram_id === auth.user.telegram_id || busy}
                    className={`text-[10px] font-bold px-2 py-1 rounded-lg border ${u.allowed ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-red-50 text-red-500 border-red-200'}`}
                  >
                    {u.allowed ? 'Доступ ✓' : 'Заблок.'}
                  </button>
                  {u.telegram_id !== auth.user.telegram_id && (
                    <button
                      onClick={() => deleteUser(u.telegram_id)}
                      disabled={busy}
                      className="text-[10px] font-bold text-slate-400 hover:text-red-500 px-1.5 py-1"
                    >×</button>
                  )}
                </div>
              </div>
            ))}
            {users.length === 0 && <div className="text-center py-3 text-xs text-slate-400">Пользователей нет</div>}
          </div>

          {/* Аудит */}
          <div className="card p-4 space-y-1.5">
            <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1">Аудит входов (последние 50)</div>
            {audit.map((a, i) => (
              <div key={i} className="flex items-center justify-between gap-2 text-[10px]">
                <span className="text-slate-500 font-mono">{new Date(a.ts * 1000).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
                <span className="text-slate-400">tg:{a.telegram_id}</span>
                <span className="font-bold text-slate-600">{a.action}</span>
              </div>
            ))}
            {audit.length === 0 && <div className="text-center py-2 text-xs text-slate-400">Событий нет</div>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
