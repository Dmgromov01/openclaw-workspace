<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet Map CSS & JS for Interactive Precipitation Radar -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .card-white {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    }
    .leaflet-container {
      border-radius: 1rem;
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [view, setView] = useState('main'); // 'main' | 'archive' | 'sources' | 'digest'

      // ================= 1. ПОГОДА & КАРТА =================
      const [weather, setWeather] = useState({ temp: 24, condition: 'Ясно, без осадков', wind: '2.8 м/с', city: 'Москва' });
      const [showMap, setShowMap] = useState(false);
      const [cityWeather, setCityWeather] = useState([]);
      const mapRef = useRef(null);
      const cityMarkersRef = useRef([]);

      // Температура по городам (Open-Meteo, без ключей) — альтернатива радару
      useEffect(() => {
        const cities = [
          { name: 'Москва', lat: 55.7558, lon: 37.6173 },
          { name: 'Химки', lat: 55.897, lon: 37.43 },
          { name: 'Мытищи', lat: 55.91, lon: 37.76 },
          { name: 'Балашиха', lat: 55.81, lon: 37.96 },
          { name: 'Подольск', lat: 55.43, lon: 37.54 },
          { name: 'Люберцы', lat: 55.68, lon: 37.89 },
          { name: 'Одинцово', lat: 55.68, lon: 37.27 },
          { name: 'Домодедово', lat: 55.44, lon: 37.75 },
          { name: 'Зеленоград', lat: 55.99, lon: 37.18 },
          { name: 'Королёв', lat: 55.91, lon: 37.82 }
        ];
        const lats = cities.map(c => c.lat).join(',');
        const lons = cities.map(c => c.lon).join(',');
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current_weather=true&timezone=Europe%2FMoscow`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data)) {
              setCityWeather(cities.map((c, i) => ({
                ...c,
                temp: Math.round(data[i]?.current_weather?.temperature ?? '—'),
                code: data[i]?.current_weather?.weathercode
              })));
            }
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        if (showMap && !mapRef.current && document.getElementById('weather-map')) {
          const map = L.map('weather-map', {
            zoomControl: false,
            attributionControl: false,
            minZoom: 7,
            maxZoom: 10,
            maxBounds: [[53.5, 33.0], [58.0, 42.0]], // Москва + МО + ближайшие регионы
            maxBoundsViscosity: 0.8
          }).setView([55.75, 37.62], 7);

          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 10
          }).addTo(map);

          mapRef.current = map;
        }

        if (mapRef.current && cityWeather.length > 0) {
          cityMarkersRef.current.forEach(m => mapRef.current.removeLayer(m));
          cityMarkersRef.current = [];
          cityWeather.forEach(c => {
            const icon = L.divIcon({
              className: '',
              html: `<div style="background:#2563eb;color:#fff;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap">${c.temp}°</div>`,
              iconSize: [38, 22],
              iconAnchor: [19, 11]
            });
            const m = L.marker([c.lat, c.lon], { icon }).addTo(mapRef.current)
              .bindPopup(`<b>${c.name}</b><br>${c.temp}°C`);
            cityMarkersRef.current.push(m);
          });
        }
      }, [showMap, cityWeather]);

      // ================= 2. ЗАДАЧИ & АРХИВ =================
      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('hub_tasks_v2');
          return saved ? JSON.parse(saved) : [
            { id: 1, text: 'Согласовать спецификацию с юристами', done: false, createdAt: '10:15' },
            { id: 2, text: 'Проверить выгрузку реестра оплат', done: true, createdAt: 'Вчера, 18:30' }
          ];
        } catch {
          return [];
        }
      });
      const [taskInput, setTaskInput] = useState('');

      useEffect(() => {
        localStorage.setItem('hub_tasks_v2', JSON.stringify(tasks));
      }, [tasks]);

      const handleAddTask = () => {
        const text = taskInput.trim();
        if (!text) return;
        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const newTask = {
          id: Date.now(),
          text: text,
          done: false,
          createdAt: timeStr
        };
        setTasks(prev => [newTask, ...prev]);
        setTaskInput('');
        haptic('medium');
      };

      const toggleTask = (id) => {
        haptic('light');
        setTasks(prev => prev.map(t => {
          if (t.id === id) {
            return { ...t, done: !t.done };
          }
          return t;
        }));
      };

      const deleteTask = (id) => {
        haptic('light');
        setTasks(prev => prev.filter(t => t.id !== id));
      };

      const clearArchive = () => {
        haptic('heavy');
        setTasks(prev => prev.filter(t => !t.done));
      };

      const activeTasks = tasks.filter(t => !t.done);
      const completedTasks = tasks.filter(t => t.done);

      // ================= 3. ИСТОЧНИКИ & RSS (через серверный API) =================
      const [sources, setSources] = useState([]);
      const [sourceName, setSourceName] = useState('');
      const [sourceType, setSourceType] = useState('TG');
      const [sourceError, setSourceError] = useState('');

      const loadSources = () => {
        fetch('/api/sources')
          .then(r => r.json())
          .then(d => { if (d?.sources) setSources(d.sources); })
          .catch(() => {});
      };

      useEffect(() => { loadSources(); }, []);

      const handleAddSource = async () => {
        const val = sourceName.trim();
        if (!val) return;
        setSourceError('');
        try {
          const r = await fetch('/api/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: sourceType, name: val, title: val })
          });
          const d = await r.json();
          if (d?.sources) setSources(d.sources);
          setSourceName('');
          setView('sources');
          haptic('medium');
        } catch {
          setSourceError('Не удалось добавить источник');
        }
      };

      const deleteSource = async (id) => {
        haptic('light');
        try {
          const r = await fetch('/api/sources?id=' + id, { method: 'DELETE' });
          const d = await r.json();
          if (d?.sources) setSources(d.sources);
        } catch {}
      };

      // ================= 4. ДАЙДЖЕСТ (живой, через API) =================
      const [digestData, setDigestData] = useState(null);
      const [digestLoading, setDigestLoading] = useState(false);
      const [digestError, setDigestError] = useState('');

      // ================= 4.5. GOOGLE КАЛЕНДАРЬ (через /api/calendar) =================
      const [calendarData, setCalendarData] = useState(null);
      const [calendarError, setCalendarError] = useState('');

      useEffect(() => {
        fetch('/api/calendar')
          .then(r => r.json())
          .then(d => setCalendarData(d))
          .catch(() => setCalendarError('Календарь недоступен'));
      }, []);

      const loadDigest = () => {
        setDigestLoading(true);
        setDigestError('');
        fetch('/api/digest')
          .then(r => r.json())
          .then(d => setDigestData(d))
          .catch(() => setDigestError('Не удалось загрузить дайджест'))
          .finally(() => setDigestLoading(false));
      };

      useEffect(() => {
        if (view === 'digest' && !digestData) loadDigest();
      }, [view]);

      // ================= 5. ВАЛЮТЫ & ПАРОЛИ =================
      const [rates, setRates] = useState({ USD: 91.20, EUR: 98.40, CNY: 12.65, JPY: 0.62, GBP: 116.50, RUB: 1.00 });
      const [calcAmount, setCalcAmount] = useState(1000);
      const [fromCurr, setFromCurr] = useState('CNY');
      const [toCurr, setToCurr] = useState('RUB');

      const [passLength, setPassLength] = useState(16);
      const [password, setPassword] = useState('k9#vL@8$qP2!mZ7x');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        if (window.Telegram?.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
        fetch('https://www.cbr-xml-daily.ru/daily_json.js')
          .then(r => r.json())
          .then(d => {
            if (d?.Valute) {
              setRates({
                USD: d.Valute.USD.Value,
                EUR: d.Valute.EUR.Value,
                CNY: d.Valute.CNY.Value,
                JPY: d.Valute.JPY.Value / d.Valute.JPY.Nominal,
                GBP: d.Valute.GBP.Value,
                RUB: 1.00
              });
            }
          })
          .catch(() => {});
        // Реальная погода для Москвы (Open-Meteo, без ключа)
        fetch('https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&timezone=Europe%2FMoscow')
          .then(r => r.json())
          .then(d => {
            const cw = d?.current_weather;
            if (!cw) return;
            const codes = {
              0: '☀️ Ясно', 1: '🌤 Почти ясно', 2: '⛅ Переменная облачность', 3: '☁️ Пасмурно',
              45: '🌫 Туман', 48: '🌫 Изморозь', 51: '🌦 Морось', 53: '🌦 Морось', 55: '🌧 Морось',
              61: '🌧 Небольшой дождь', 63: '🌧 Дождь', 65: '🌧 Сильный дождь',
              71: '🌨 Небольшой снег', 73: '🌨 Снег', 75: '❄️ Сильный снег',
              80: '🌦 Ливень', 81: '🌧 Ливень', 82: '⛈ Сильный ливень',
              95: '⛈ Гроза', 96: '⛈ Гроза с градом', 99: '⛈ Гроза с градом'
            };
            setWeather({
              temp: Math.round(cw.temperature),
              condition: codes[cw.weathercode] || '🌡 ' + cw.weathercode,
              wind: cw.windspeed + ' м/с',
              city: 'Москва'
            });
          })
          .catch(() => {});
      }, []);

      const haptic = (type = 'light') => {
        window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(type);
      };

      const convertValue = () => {
        const inRub = calcAmount * rates[fromCurr];
        const res = inRub / rates[toCurr];
        return res.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const generatePassword = () => {
        haptic('light');
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~';
        let res = '';
        for (let i = 0; i < passLength; i++) {
          res += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        setPassword(res);
        setCopied(false);
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(password);
        setCopied(true);
        haptic('notification');
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="max-w-xl mx-auto px-5 py-4 font-sans">

          {/* ================= 1. ГЛАВНЫЙ ЭКРАН ================= */}
          {view === 'main' && (
            <div className="space-y-5">

              {/* 1. Погода + Карта температур */}
              <div className="card-white rounded-3xl p-5 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Погода & Карта</span>
                  <button
                    onClick={() => { haptic(); setShowMap(!showMap); }}
                    className="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200 active:scale-95 transition"
                  >
                    {showMap ? 'Скрыть карту ▲' : 'Карта температур ▼'}
                  </button>
                </div>

                <div className="flex items-center justify-between">
                  <div className="text-4xl font-black text-slate-900">{weather.temp}°C</div>
                  <div className="text-right">
                    <div className="text-base font-bold text-slate-800">☀️ {weather.condition}</div>
                    <div className="text-xs text-slate-500 mt-0.5">Ветер {weather.wind} • {weather.city}</div>
                  </div>
                </div>

                {/* Карта: температура по городам МО (Open-Meteo, без ключей) */}
                {showMap && (
                  <div className="pt-2 border-t border-slate-100 space-y-3">
                    <div id="weather-map" className="w-full h-52 bg-slate-100 rounded-2xl border border-slate-200"></div>
                    <div className="text-[10px] text-slate-400 font-semibold text-center">Температура сейчас по городам МО — кликните по метке для деталей</div>
                  </div>
                )}
              </div>

              {/* 1.5. Google Календарь */}
              <div className="card-white rounded-3xl p-5 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">📅 Google Календарь</span>
                  <span className="text-[10px] font-bold text-slate-400">7 дней</span>
                </div>
                {calendarError ? (
                  <div className="text-xs text-red-500">{calendarError}</div>
                ) : !calendarData ? (
                  <div className="text-center py-2 text-xs text-slate-400">Загружаем события…</div>
                ) : (
                  <div className="space-y-2">
                    {calendarData.days && calendarData.days.filter(d => d.events.length > 0).length === 0 && (
                      <div className="text-center py-2 text-xs text-slate-400">На ближайшие 7 дней событий нет.</div>
                    )}
                    {calendarData.days && calendarData.days.map(d => d.events.length > 0 && (
                      <div key={d.date} className="bg-slate-50 border border-slate-200 rounded-2xl p-3">
                        <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wide mb-1.5">{d.label}</div>
                        <div className="space-y-1.5">
                          {d.events.map((ev, i) => (
                            <div key={i} className="flex items-start gap-2">
                              <span className="font-mono text-xs font-black text-blue-600 shrink-0 mt-0.5">{ev.time}</span>
                              <div className="min-w-0 flex-1">
                                <div className="text-xs font-bold text-slate-800 leading-snug">{ev.summary}</div>
                                {ev.location && <div className="text-[10px] text-slate-400 truncate">📍 {ev.location}</div>}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* 2. Дела на сегодня & Архив */}
              <div className="card-white rounded-3xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <div className="text-base font-black text-slate-900">Дела на сегодня</div>
                  <button
                    onClick={() => { haptic(); setView('archive'); }}
                    className="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200 hover:bg-blue-100 transition active:scale-95"
                  >
                    📦 Архив ({completedTasks.length}) →
                  </button>
                </div>

                {/* Список активных задач */}
                <div className="space-y-2">
                  {activeTasks.map(t => (
                    <div
                      key={t.id}
                      className="flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100/80 border border-slate-200 rounded-2xl transition"
                    >
                      <div
                        onClick={() => toggleTask(t.id)}
                        className="flex items-center gap-3 flex-1 cursor-pointer"
                      >
                        <div className="w-6 h-6 rounded-lg border-2 border-slate-300 flex items-center justify-center bg-white shrink-0 active:scale-90 transition">
                          {t.done && <span className="text-blue-600 text-xs font-black">✓</span>}
                        </div>
                        <span className="text-xs font-bold text-slate-800 leading-snug">
                          {t.text}
                        </span>
                      </div>
                      <span className="text-[10px] font-mono text-slate-400 ml-2">{t.createdAt}</span>
                    </div>
                  ))}

                  {activeTasks.length === 0 && (
                    <div className="text-center py-4 text-xs text-slate-400">
                      Все текущие дела выполнены! Добавьте новую задачу ниже.
                    </div>
                  )}
                </div>

                {/* Добавление задачи */}
                <div className="flex gap-2 pt-1">
                  <input
                    type="text"
                    placeholder="Новая задача..."
                    value={taskInput}
                    onChange={(e) => setTaskInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') handleAddTask(); }}
                    className="flex-1 bg-slate-50 border-2 border-slate-200 text-xs rounded-2xl px-4 py-3 text-slate-900 focus:outline-none focus:border-blue-600"
                  />
                  <button
                    type="button"
                    onClick={handleAddTask}
                    className="px-5 py-3 bg-slate-900 hover:bg-black active:scale-95 text-white rounded-2xl font-black text-lg transition flex items-center justify-center"
                  >
                    +
                  </button>
                </div>
              </div>

              {/* 3. Лента каналов & RSS */}
              <div className="card-white rounded-3xl p-5 space-y-4">
                <div className="flex items-center justify-between">
                  <div className="text-base font-black text-slate-900">Лента каналов & RSS</div>
                  <button
                    onClick={() => { haptic(); setView('sources'); }}
                    className="px-3 py-1.5 rounded-xl bg-blue-50 text-blue-600 font-bold text-xs border border-blue-200 active:scale-95 transition"
                  >
                    ⚙ Источники ({sources.length})
                  </button>
                </div>

                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                  <div className="text-xs font-bold text-blue-600 mb-0.5">● Подключено источников: {sources.length}</div>
                  <div className="text-xs text-slate-600 truncate">
                    {sources.map(s => s.name).join(', ')}
                  </div>
                </div>

                <button
                  onClick={() => { haptic('medium'); setView('digest'); }}
                  className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white rounded-2xl font-bold text-xs transition shadow-md shadow-blue-500/20"
                >
                  📖 Читать полный AI-Дайджест →
                </button>
              </div>

              {/* 4. Конвертер валют */}
              <div className="card-white rounded-3xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-1.5">
                  <div className="text-base font-black text-slate-900">💱 Конвертер валют</div>
                  <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200 whitespace-nowrap">ЦБ РФ Официальный</span>
                </div>

                <div className="flex flex-wrap gap-1.5 items-stretch">
                  <input
                    type="number"
                    value={calcAmount}
                    onChange={(e) => setCalcAmount(Number(e.target.value))}
                    className="flex-1 min-w-0 basis-24 bg-slate-50 border-2 border-slate-200 text-base font-black rounded-2xl px-3 py-2.5 text-slate-900 focus:outline-none focus:border-blue-600"
                  />
                  <select
                    value={fromCurr}
                    onChange={(e) => setFromCurr(e.target.value)}
                    className="shrink-0 bg-slate-50 border-2 border-slate-200 text-xs font-bold rounded-2xl px-2 py-2.5 text-slate-800"
                  >
                    {['USD', 'EUR', 'CNY', 'JPY', 'GBP', 'RUB'].map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <span className="text-slate-400 font-bold self-center shrink-0">→</span>
                  <select
                    value={toCurr}
                    onChange={(e) => setToCurr(e.target.value)}
                    className="shrink-0 bg-slate-50 border-2 border-slate-200 text-xs font-bold rounded-2xl px-2 py-2.5 text-slate-800"
                  >
                    {['RUB', 'USD', 'EUR', 'CNY', 'JPY', 'GBP'].map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <div className="p-3.5 bg-emerald-50 rounded-2xl border border-emerald-200 flex flex-col items-center gap-0.5 text-center">
                  <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Результат</span>
                  <span className="text-lg font-black text-emerald-700 font-mono">{convertValue()} {toCurr}</span>
                </div>
              </div>

              {/* 5. Генератор паролей */}
              <div className="card-white rounded-3xl p-5 space-y-3.5">
                <div className="flex items-center justify-between">
                  <div className="text-base font-black text-slate-900">🔐 Генератор паролей</div>
                  <span className="text-xs font-black text-blue-600 font-mono">{passLength} симв.</span>
                </div>

                <input
                  type="range" min="12" max="32" value={passLength}
                  onChange={(e) => setPassLength(Number(e.target.value))}
                  className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                />

                <div
                  onClick={copyToClipboard}
                  className="p-3.5 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-between cursor-pointer active:scale-98 transition"
                >
                  <span className="font-mono text-xs font-bold text-slate-900 break-all">{password}</span>
                  <span className="text-xs font-bold text-blue-600 ml-2 shrink-0">
                    {copied ? 'Скопировано ✓' : 'Копировать'}
                  </span>
                </div>

                <button
                  onClick={generatePassword}
                  className="w-full py-3 bg-slate-900 hover:bg-black active:scale-98 text-white rounded-2xl font-bold text-xs transition"
                >
                  Сгенерировать новый пароль
                </button>
              </div>

            </div>
          )}

          {/* ================= 2. ЭКРАН: АРХИВ ВЫПОЛНЕННЫХ ДЕЛ ================= */}
          {view === 'archive' && (
            <div className="space-y-5 animate-fade-in">
              <div className="flex justify-between items-center">
                <button
                  onClick={() => { haptic(); setView('main'); }}
                  className="px-3.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs transition"
                >
                  ← Назад к делам
                </button>
                {completedTasks.length > 0 && (
                  <button
                    onClick={clearArchive}
                    className="text-xs font-bold text-red-600 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200 active:scale-95"
                  >
                    Очистить весь архив
                  </button>
                )}
              </div>

              <div>
                <h1 className="text-xl font-black text-slate-900">Архив выполненных дел</h1>
                <div className="text-xs text-slate-500 mt-0.5">Кликните на задачу, чтобы вернуть её обратно в список дел.</div>
              </div>

              <div className="space-y-2.5">
                {completedTasks.map(t => (
                  <div
                    key={t.id}
                    className="flex items-center justify-between p-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm"
                  >
                    <div
                      onClick={() => toggleTask(t.id)}
                      className="flex items-center gap-3 flex-1 cursor-pointer"
                    >
                      <div className="w-6 h-6 rounded-lg bg-emerald-500 text-white flex items-center justify-center text-xs font-bold shrink-0">
                        ✓
                      </div>
                      <span className="text-xs font-semibold text-slate-400 line-through">
                        {t.text}
                      </span>
                    </div>
                    <button
                      onClick={() => deleteTask(t.id)}
                      className="text-slate-300 hover:text-red-500 text-sm px-2 py-1 font-bold active:scale-90"
                    >
                      ✕
                    </button>
                  </div>
                ))}

                {completedTasks.length === 0 && (
                  <div className="text-center py-10 text-xs text-slate-400 card-white rounded-3xl p-6">
                    В архиве нет выполненных задач.
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ================= 3. ЭКРАН: УПРАВЛЕНИЕ ИСТОЧНИКАМИ ================= */}
          {view === 'sources' && (
            <div className="space-y-5 animate-fade-in">
              <button
                onClick={() => { haptic(); setView('main'); }}
                className="px-3.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-xl text-xs transition"
              >
                ← Назад на главную
              </button>

              <div>
                <h1 className="text-xl font-black text-slate-900">Подключенные источники</h1>
                <div className="text-xs text-slate-500 mt-0.5">Каналы и RSS-ленты, с которых собирается AI-Дайджест.</div>
              </div>

              {/* Список текущих источников */}
              <div className="space-y-2">
                {sources.map(s => (
                  <div key={s.id} className="card-white rounded-2xl p-3.5 flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <span className="px-2 py-0.5 text-[10px] font-bold rounded-md bg-blue-50 text-blue-600 border border-blue-200">
                        {s.type}
                      </span>
                      <div>
                        <div className="text-xs font-bold text-slate-900">{s.name}</div>
                        <div className="text-[10px] text-slate-400">{s.title}</div>
                      </div>
                    </div>
                    <button
                      onClick={() => deleteSource(s.id)}
                      className="text-slate-300 hover:text-red-500 text-sm font-bold px-2 py-1"
                    >
                      ✕
                    </button>
                  </div>
                ))}
              </div>

              {/* Форма добавления */}
              <div className="card-white rounded-3xl p-5 space-y-3.5">
                <div className="text-xs font-bold text-slate-800">Добавить новый канал или ленту</div>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setSourceType('TG')}
                    className={`flex-1 py-2 rounded-xl text-xs font-bold border ${sourceType === 'TG' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                  >
                    Telegram
                  </button>
                  <button
                    type="button"
                    onClick={() => setSourceType('RSS')}
                    className={`flex-1 py-2 rounded-xl text-xs font-bold border ${sourceType === 'RSS' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200'}`}
                  >
                    RSS URL
                  </button>
                </div>

                <input
                  type="text"
                  placeholder={sourceType === 'TG' ? '@channel_name или t.me/...' : 'https://site.com/rss'}
                  value={sourceName}
                  onChange={(e) => setSourceName(e.target.value)}
                  className="w-full bg-slate-50 border-2 border-slate-200 text-xs rounded-2xl px-3.5 py-2.5 text-slate-900 focus:outline-none focus:border-blue-600"
                />

                <button
                  type="button"
                  onClick={handleAddSource}
                  className="w-full py-3 bg-blue-600 active:scale-98 text-white rounded-2xl font-bold text-xs transition"
                >
                  + Подключить источник
                </button>
              </div>
            </div>
          )}

          {/* ================= 4. ЭКРАН: AI-ДАЙДЖЕСТ ================= */}
          {view === 'digest' && (
            <div className="space-y-5 animate-fade-in">
              <button
                onClick={() => { haptic(); setView('main'); }}
                className="px-3.5 py-1.5 bg-slate-200 text-slate-800 font-bold rounded-xl text-xs transition"
              >
                ← Назад на главную
              </button>

              <div>
                <h1 className="text-xl font-black text-slate-900">AI-Дайджест новостей</h1>
                <div className="text-xs text-slate-500 mt-0.5">Сформирован на основе ваших {sources.length} подключенных источников.</div>
              </div>

              <div className="space-y-3.5">
                {digestLoading && (
                  <div className="text-center py-8 text-xs text-slate-400">Собираем дайджест…</div>
                )}
                {digestError && !digestLoading && (
                  <div className="text-center py-6 text-xs text-red-500">{digestError}</div>
                )}
                {!digestLoading && !digestError && digestData && (
                  <>
                    {digestData.blocks && digestData.blocks.length > 0 ? digestData.blocks.map((block, bi) => (
                      <div key={bi} className="card-white rounded-3xl p-4 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="px-2 py-0.5 rounded-lg bg-blue-50 text-blue-700 text-[10px] font-bold border border-blue-200">
                            {block.title}
                          </span>
                          <span className="text-[10px] font-semibold text-slate-400">{block.posts.length} постов</span>
                        </div>
                        <div className="space-y-2">
                          {block.posts.map((p, pi) => (
                            <div key={pi} className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                              • {p}
                            </div>
                          ))}
                        </div>
                      </div>
                    )) : (
                      <div className="text-center py-8 text-xs text-slate-400">За выбранный период свежих постов нет.</div>
                    )}
                    {digestData.curs && (
                      <div className="card-white rounded-3xl p-4 text-center">
                        <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">💱 Курс (ЦБ)</div>
                        <div className="text-xs font-black text-slate-700">{digestData.curs}</div>
                        <div className="text-[10px] text-slate-400 mt-1">⭐ Всего постов: {digestData.total}</div>
                      </div>
                    )}
                  </>
                )}
              </div>
              <button
                onClick={() => { haptic('light'); loadDigest(); }}
                className="w-full py-3 bg-slate-900 active:scale-98 text-white rounded-2xl font-bold text-xs transition"
              >
                🔄 Обновить дайджест
              </button>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
