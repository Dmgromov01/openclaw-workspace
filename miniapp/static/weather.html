<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Погода · Москва</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#fff;
    overflow-x:hidden;
  }

  /* ===== Фон: сочное небо ===== */
  .sky {
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(circle at 78% 12%, rgba(255,238,170,0.95) 0%, rgba(255,222,120,0.5) 20%, rgba(255,222,120,0) 44%),
      radial-gradient(circle at 50% 55%, rgba(100,205,255,0.5) 0%, rgba(100,205,255,0) 60%),
      linear-gradient(160deg, #00A8F3 0%, #0078E0 50%, #0056B8 100%);
  }
  .sky::after {
    content:""; position:absolute; left:0; top:0; right:0; height:42%;
    background:linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
  }
  .clouds { position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.28; }

  /* ===== Силуэт города на фоне ===== */
  .cityline {
    position:fixed; left:0; right:0; bottom:0; z-index:-1; pointer-events:none;
    opacity:0.22;
  }

  /* ===== Шапка ===== */
  .header {
    display:flex; align-items:center; gap:12px;
    padding: calc(12px + env(safe-area-inset-top)) 18px 0;
  }
  .header .back {
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#fff; text-decoration:none; flex-shrink:0;
  }
  .header .loc { font-size:16px; font-weight:600; text-shadow:0 1px 4px rgba(0,40,100,0.4); }

  /* ===== Основной блок ===== */
  .main { padding:4px 20px 0; }
  .city { font-size:22px; font-weight:700; text-shadow:0 2px 8px rgba(0,40,100,0.45); }
  .day { font-size:14px; color:rgba(255,255,255,0.92); font-weight:500; margin-top:2px; text-shadow:0 1px 4px rgba(0,40,100,0.4); }
  .temp { font-size:86px; font-weight:200; letter-spacing:-4px; line-height:1; margin-top:2px; text-shadow:0 4px 20px rgba(0,40,100,0.4); }
  .temp sup { font-size:42px; font-weight:300; }

  /* ===== Большая иллюстрация (сочная, объёмная) ===== */
  .art-wrap { display:flex; justify-content:center; margin:4px 0 10px; }
  .art { width:250px; height:185px; filter:drop-shadow(0 22px 36px rgba(0,50,120,0.45)); }

  /* ===== Параметры ===== */
  .params {
    display:flex; justify-content:space-around; gap:8px;
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:18px;
    padding:12px 8px;
    margin:0 2px;
  }
  .param { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; min-width:0; }
  .param .p-ic { width:20px; height:20px; opacity:0.95; }
  .param .p-val { font-size:15px; font-weight:700; line-height:1.1; white-space:nowrap; }
  .param .p-label { font-size:11px; color:rgba(255,255,255,0.85); font-weight:500; }

  /* ===== Почасовка: уменьшенные копии больших рисунков ===== */
  .h-title { font-size:13px; font-weight:600; color:rgba(255,255,255,0.9); margin:16px 2px 8px; text-transform:uppercase; letter-spacing:0.5px; }
  .hourly {
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory;
  }
  .hourly::-webkit-scrollbar { display:none; }
  .h-card {
    flex:0 0 62px; scroll-snap-align:center;
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:16px;
    padding:9px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .h-card .ht { font-size:12px; font-weight:600; opacity:0.95; }
  .h-card .hi { width:38px; height:28px; filter:drop-shadow(0 3px 5px rgba(0,40,100,0.3)); }
  .h-card .ht2 { font-size:15px; font-weight:700; }

  /* ===== Неделя ===== */
  .w-title { font-size:13px; font-weight:600; color:rgba(255,255,255,0.9); margin:18px 2px 8px; text-transform:uppercase; letter-spacing:0.5px; }
  .week {
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.28);
    border-radius:18px;
    padding:4px 14px;
    margin-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .w-row { display:flex; align-items:center; gap:10px; min-height:48px; }
  .w-row + .w-row { border-top:0.5px solid rgba(255,255,255,0.2); }
  .w-row .wd { width:78px; font-size:15px; font-weight:600; }
  .w-row .wi { width:42px; height:32px; margin-left:auto; filter:drop-shadow(0 3px 5px rgba(0,40,100,0.3)); }
  .w-row .wlo { width:38px; text-align:right; font-size:13px; color:rgba(255,255,255,0.7); font-weight:500; }
  .w-row .whi { width:38px; text-align:right; font-size:15px; font-weight:700; }
</style>
</head>

<script>

// Порядок и подписи
const WX_ORDER = ['partly','sun','cloudy','rain','storm','snow','night'];
const WX_LABEL = { sun:'Ясно', partly:'Переменная облачность', cloudy:'Облачно', rain:'Ливень', storm:'Ураган', snow:'Снег', night:'Ночь' };

// ================= РЕНДЕР =================
let idx = 0;

function render() {
  const key = WX_ORDER[idx];
  const big = document.getElementById('bigArt');
  if (big) big.innerHTML = WX[key];
  const cond = document.getElementById('bigCond');
  if (cond) cond.textContent = WX_LABEL[key];
}

// Почасовка: те же рисунки, уменьшенные
const hourlyData = [
  {t:'11:00', w:'cloudy', v:'20°'}, {t:'12:00', w:'cloudy', v:'21°'},
  {t:'13:00', w:'sun', v:'22°'},    {t:'14:00', w:'cloudy', v:'22°'},
  {t:'15:00', w:'partly', v:'21°'}, {t:'16:00', w:'cloudy', v:'21°'},
  {t:'17:00', w:'cloudy', v:'20°'}, {t:'18:00', w:'partly', v:'19°'},
  {t:'19:00', w:'cloudy', v:'18°'}, {t:'20:00', w:'rain', v:'17°'}
];
function renderHourly() {
  const row = document.getElementById('hourlyRow');
  row.innerHTML = hourlyData.map(h =>
    `<div class="h-card"><div class="ht">${h.t}</div><div class="hi">${WX[h.w]}</div><div class="ht2">${h.v}</div></div>`
  ).join('');
}

// Неделя: те же рисунки
const weekData = [
  {d:'Сегодня', w:'partly', lo:'19°', hi:'22°'}, {d:'Вторник', w:'cloudy', lo:'17°', hi:'21°'},
  {d:'Среда', w:'cloudy', lo:'16°', hi:'20°'},   {d:'Четверг', w:'storm', lo:'14°', hi:'18°'},
  {d:'Пятница', w:'rain', lo:'12°', hi:'16°'},   {d:'Суббота', w:'sun', lo:'13°', hi:'17°'},
  {d:'Воскресенье', w:'snow', lo:'14°', hi:'19°'}
];
function renderWeek() {
  const row = document.getElementById('weekRow');
  row.innerHTML = weekData.map(d =>
    `<div class="w-row"><div class="wd">${d.d}</div><div class="wi">${WX[d.w]}</div><div class="wlo">${d.lo}</div><div class="whi">${d.hi}</div></div>`
  ).join('');
}

// Клик по большой иллюстрации — сменить погоду
document.getElementById('bigArt').addEventListener('click', () => {
  idx = (idx + 1) % WX_ORDER.length;
  render();
});

// Дата
const d = new Date();
const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const tl = document.getElementById('todayLabel');
if (tl) tl.textContent = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];

render();
renderHourly();
renderWeek();
</script>
</body>
